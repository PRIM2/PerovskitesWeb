<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyPer Toolkit — Search in range</title>
  <link rel="icon" type="image/png" href="baseLayout/images/newLogo.png" />

  <!-- Select2 & jQuery -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>


  <!-- MathJax -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
  <!-- HEADER -->
  <div id="header"></div>

  <div class="main-container">
    <div class="containerDatosEntrada">
      <h1>Search ion in range</h1>
      <p>Poner pequeña explicación de para qué sirve esta funcionalidad.</p>
      <br>
      <hr />
      <br>

      <form id="datosForm">

        <!-- Configuración -->
        <div class="form-group">
          <h2>Remaining data</h2>
          <div class="form-row">
            <label for="missingKind">Select missing species:</label>
            <select id="missingKind">
              <option value="A">Cation A</option>
              <option value="B">Cation B</option>
              <option value="X">Anion</option>
            </select>
          </div>

          <!-- Ambos inputs en la misma fila -->
          <div class="form-row">
            <label for="tfMin" style="margin-right: 8px;">TF min:</label>
            <input type="number" id="tfMin" step="0.001" value="0.8" style="width:100px; margin-right:16px;" />

            <label for="tfMax" style="margin-right: 8px;">TF max:</label>
            <input type="number" id="tfMax" step="0.001" value="1" style="width:100px;" />
          </div>
        </div>

        <hr />

        <!-- Cation A -->
        <div class="form-group">
          <h2>Cation A</h2>
          <div class="form-row">
            <label for="cationA">Select A:</label>
            <select id="cationA">
              <option></option>
            </select>
          </div>

          <div class="form-row formula-inline">
            <label for="volumenCationManualA">Cation A volume (Å³):</label>
            <input type="number" id="volumenCationManualA" step="any" placeholder="Manually enter value">
            <span class="formula">
              \( V_{a} = \tfrac{4}{3} \pi r_{a}^3 ;\;\;
                r_{a} = \sqrt[3]{\tfrac{3·V_{a}}{4\pi}} \)
            </span>
          </div>
          <br>
          <strong>Article:</strong>
          <a href="https://doi.org/10.1016/j.jssc.2022.123635" target="_blank">
            https://doi.org/10.1016/j.jssc.2022.123635
          </a>
        </div>

        <hr />

        <!-- Cation B -->
        <div class="form-group2">
          <h2>Cation B</h2>
          <div class="form-row">
            <label for="cationB">Select B:</label>
            <select id="cationB">
              <option></option>
            </select>
          </div>

          <div class="form-row">
            <label for="cationManualB">\(r_B (Å):\)</label>
            <input type="number" id="cationManualB" step="any" placeholder="Manually enter value">
          </div>
        </div>

        <hr />

        <!-- Anion -->
        <div class="form-group2">
          <h2>Anion</h2>
          <div class="form-row">
            <label for="anion">Select X:</label>
            <select id="anion">
              <option></option>
            </select>
          </div>

          <div class="form-row">
            <label for="anionManualR">\(r_{X,\text{eff}} (Å):\)</label>
            <input type="number" id="anionManualR" step="any" placeholder="Manually enter value">
          </div>

          <div class="form-row">
            <label for="anionManualH">\(h_{X,\text{eff}} (Å):\)</label>
            <input type="number" id="anionManualH" step="any" placeholder="Manually enter value">
          </div>
        </div>

        <hr />

        <!-- Botón -->
        <div class="button-center">
          <button type="submit">Buscar combinaciones</button>
        </div>
      </form>

      <br />
      <label for="toggleSortOrder">Order by TF : </label>
      <button type="button" id="toggleSortOrder">↑ Ascending ↑</button>

      <!-- Resultados -->
      <p id="rango" style="text-align: center;"></p>
      <div class="errorMessage" id="errorInput"></div>
      <div id="resultado" style="margin-top: 16px;"></div>
    </div>

    <!-- ASIDE -->
    <div id="aside"></div>
  </div>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- Scripts comunes -->
  <script type="module" src="indexContent/dependencies2.js"></script>
  <script type="module" src="baseLayout/scripts/layoutLoader.js"></script>
  <script type="module" src="indexContent/scripts/tolerancia2.js"></script>
</body>
</html>
